<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* BRAND COLORS (From Website style.css) */
        /* Primary: #00d2ff (Cyan) */
        /* Accent: #ff3d00 (Orange/Red) */

        /* CLEAN PROFESSIONAL THEME (Light Mode) */
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        font-family: 'Inter',
        'Helvetica Neue',
        Helvetica,
        Arial,
        sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #334155;
        }

        table {
            border-spacing: 0;
            width: 100%;
        }

        td {
            padding: 0;
        }

        img {
            border: 0;
        }

        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f8fafc;
            padding-bottom: 60px;
        }

        .main-content {
            background-color: #ffffff;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border-top: 4px solid #00d2ff;
            /* Brand Primary */
        }

        /* Brand Header */
        .header {
            padding: 35px 40px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
            background-color: #ffffff;
        }

        .logo-text {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            line-height: 1.1;
            color: #0f172a;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            display: inline-block;
        }

        .logo-text span {
            color: #00d2ff;
            /* Brand Primary (Cyan) */
            display: block;
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* Body Content */
        .content-block {
            padding: 40px;
            line-height: 1.7;
            font-size: 16px;
            color: #334155;
        }

        .content-block p {
            margin-bottom: 24px;
            font-weight: 400;
        }

        .content-block strong {
            color: #0f172a;
            font-weight: 600;
        }

        /* Call to Action */
        .btn-container {
            margin: 35px 0 15px;
        }

        .btn {
            background-color: #ff3d00;
            /* Brand Accent */
            color: #ffffff;
            padding: 16px 36px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 16px;
            display: inline-block;
            box-shadow: 0 4px 6px -1px rgba(255, 61, 0, 0.25);
            transition: background-color 0.2s, transform 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background-color: #e03200;
            transform: translateY(-2px);
        }

        /* Referral Box (Subtle) */
        .referral-box {
            margin-top: 45px;
            padding: 25px;
            background-color: #f0f9ff;
            /* Very light cyan tint */
            border: 1px dashed #00d2ff;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .referral-link {
            color: #0099cc;
            /* Primary Dark */
            font-weight: 700;
            text-decoration: none;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            padding: 30px;
        }

        .footer a {
            color: #94a3b8;
            text-decoration: underline;
        }

        .address {
            margin-top: 10px;
            font-style: normal;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
                <td align="center">
                    <br><br>
                    <div class="main-content"
                        style="background-color: #ffffff; margin: 0 auto; width: 100%; max-width: 600px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); overflow: hidden; border-top: 4px solid #00d2ff;">
                        <!-- Header -->
                        <div class="header"
                            style="padding: 35px 40px; text-align: left; border-bottom: 1px solid #f1f5f9; background-color: #ffffff;">
                            <!-- INLINE STYLED LOGO (Email Safe) -->
                            <div
                                style="font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 800; line-height: 1.1; color: #0f172a; font-size: 26px; text-transform: uppercase; letter-spacing: -0.5px;">
                                GEMINI MAN <br>
                                <span
                                    style="color: #00d2ff; display: block; font-size: 14px; letter-spacing: 2px; margin-top: 2px;">ROOFING</span>
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="content-block">
                            <!-- AI Content Injected Here -->
                            {content}

                            <!-- CTA Section -->
                            <div class="btn-container">
                                <a href="{inspection_url}" class="btn">Start Free Inspection</a>
                            </div>

                            <!-- Referral Footer -->
                            <div class="referral-box">
                                <strong>Neighbor Discount:</strong> Refer a friend and get a $250 Visa Gift Card.<br>
                                <a href="https://geminimanroofing.com/refer.html" class="referral-link">Click here to
                                    refer</a>
                            </div>

                            <p style="margin-top: 30px; font-size: 14px; color: #64748b;">
                                Best,<br>
                                <strong>The Gemini Man Team</strong>
                            </p>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="footer">
                        <p>&copy; 2026 Gemini Man Roofing. All rights reserved.</p>
                        <p class="address">Serving Dallas, Fort Worth, and Oklahoma City.</p>
                        <p><a href="#">Unsubscribe</a> | <a href="#">View in Browser</a></p>
                    </div>
                </td>
            </tr>
        </table>
    </div>

</body>

</html>
